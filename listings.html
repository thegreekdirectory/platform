    /* Desktop filters overlay: positions the sidebar panel as a fixed overlay on top of content */
    .desktop-filters-overlay {
        position: fixed !important;
        top: 0;

        width: 280px;

    /* Semi-transparent backdrop behind the overlay */
    #desktopFiltersBackdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.3);
        z-index: 199;
    }

    /* ── Star button: floating circular pill with backdrop blur ── */
    .star-button {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1.5px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22), 0 0 0 1px rgba(0,0,0,0.04);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .star-button:hover {
        transform: scale(1.15);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.30), 0 0 0 1px rgba(0,0,0,0.06);
        background: rgba(255, 255, 255, 1);
    }
    .star-button:active {
        transform: scale(0.92);
    }
    .star-icon {
        width: 17px;
        height: 17px;
        fill: #d1d5db;
        stroke: #9ca3af;
        stroke-width: 1.8;
        transition: fill 0.15s ease, stroke 0.15s ease;
    }
    .star-button.starred {
        background: rgba(255, 253, 235, 0.97);
        border-color: rgba(234, 179, 8, 0.5);
        box-shadow: 0 2px 10px rgba(202, 138, 4, 0.30), 0 0 0 1px rgba(234,179,8,0.15);
    }
    .star-button.starred .star-icon {
        fill: #facc15;
        stroke: #ca8a04;
    }
    .star-button.starred:hover {
        box-shadow: 0 4px 16px rgba(202, 138, 4, 0.40), 0 0 0 1px rgba(234,179,8,0.2);
    }

    /* ── filterPanel top-bar style (used mobile + split-view overlay) ── */
    #filterPanel {
        position: relative;
        z-index: 30;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        max-height: calc(100vh - 60px);
        overflow-y: auto;
    }

    /* Dark-mode override for the rule directly above, placed here (NOT in
       css/listings.css's own @media (prefers-color-scheme: dark) block)
       deliberately: css/listings.css loads BEFORE this inline <style>
       block (see the <link>/<style> order in <head>), and both selectors
       have identical specificity, so a dark override placed in that
       earlier file would be overwritten by this rule's own
       "background: #fff" the instant this rule is reached, regardless of
       dark mode being active. Placing the override immediately after the
       rule it corrects is what actually makes it win — same cascade-order
       fix already used for #eventFilterPanel in css/events.css. */
    @media (prefers-color-scheme: dark) {
        #filterPanel {
            background: #2a2a2a;
            border-bottom-color: #404040;
        }
    }

    /* ── Global mobile touch fix ── */
    /* All <a> and <button> must respond to single taps on iOS/Android.
       touch-action:manipulation disables double-tap-to-zoom on the element,
       which is the #1 cause of swallowed taps on mobile Safari.
       The -webkit-tap-highlight-color removal prevents the grey flash. */


    /* Touch-action fixes: ensure all interactive buttons respond to taps on touchscreen */
    .map-control-btn,

    #refreshBtn,
    #gridViewBtn, #gridViewBtn2,

    .location-search-result,
    .star-button {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
    }</style>
